<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chapter 01 Review</title>
<meta name="description" content="Expert review of Mondo-derived synonym proposals for the ICD-11 Foundation, release v20261030.">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e3e6eb;
  --brand: #1f4e79; --brand-soft: #e8f0f8; --accent: #a6ce39;  /* ORCID green */
  --ok: #2e7d32; --ok-soft: #e8f5e9; --bad: #c62828; --bad-soft: #ffebee;
  --warn: #b26a00; --warn-soft: #fff4e0; --info: #1565c0; --info-soft: #e3f2fd;
  --mock: #5b21b6; --mock-soft: #f3e8ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; min-width: 1100px; }
a { color: var(--info); }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
input, select, textarea { font: inherit; }

header.top { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 52px; }
header.top .brand { font-weight: 700; font-size: 15px; }
header.top nav a { color: #dce7f2; text-decoration: none; margin-right: 18px; padding: 15px 0; border-bottom: 3px solid transparent; }
header.top nav a.on { color: #fff; border-color: var(--accent); }
header.top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.chip { background: rgba(255,255,255,.14); border-radius: 12px; padding: 2px 10px; font-size: 12px; }
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; text-align: center; margin-left: 4px; }
.orcid-btn { background: #fff; color: #333; border: 0; border-radius: 4px; padding: 5px 10px; display: flex; gap: 6px; align-items: center; }
.idicon { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 9px/16px sans-serif; justify-content: center; vertical-align: -3px; }

main { padding: 20px; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 22px 0 8px; }
.lead { color: var(--muted); margin: 0 0 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
.note { background: var(--info-soft); border-left: 3px solid var(--info); padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 8px 0; }
.note.warn { background: var(--warn-soft); border-color: var(--warn); }
.note.mock { background: var(--mock-soft); border-color: var(--mock); color: var(--mock); }
table.grid { width: 100%; border-collapse: collapse; background: var(--panel); }
table.grid th, table.grid td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grid th { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: #fafbfc; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.pill { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--info); }
.pill.grey { background: #eef0f3; color: #555; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 12px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.row { display: flex; gap: 12px; align-items: center; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: none; padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--brand); border-color: var(--brand); font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.switch input { width: 30px; height: 16px; }

/* review page */
.review { display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
.elist { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: start; }
.elist .item { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; cursor: pointer; }
.elist .item.sel { background: var(--brand-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #cfd4dc; flex: none; }
.dot.part { background: #f0b429; } .dot.done { background: var(--ok); }
.cfdot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
.cfdot.sev2 { background: var(--bad); }
/* CodeFusion overlay (relation pills as in v3) */
.cf { display: inline-block; white-space: nowrap; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
.cf.confirmed { background: var(--ok-soft); color: var(--ok); }
.cf.broader, .cf.narrower { background: var(--info-soft); color: var(--info); }
.cf.sibling { background: #ede7f6; color: #5e35b1; }
.cf.unrelated { background: var(--bad-soft); color: var(--bad); }
.cf.nomatch, .cf.rootfallback { background: #eef0f3; color: #555; }
.syn.contested { background: #fff8f8; }
.cflegend { background: #fafbfc; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 12px; margin: 6px 0; }
.cfbanner { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-top: 10px; }
.cfbanner.ok { background: var(--ok-soft); } .cfbanner.bad { background: var(--warn-soft); border-left: 3px solid var(--warn); }
.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal .box { background: #fff; border-radius: 10px; max-width: 760px; max-height: 85vh; overflow: auto; padding: 18px 22px; }
.modal h3 { font-size: 14px; margin: 14px 0 4px; }
.modal .keypt { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 6px 10px; font-size: 13px; }
.elist .lbl { flex: 1; } .elist .sub { font-size: 11px; color: var(--muted); }
.ehead .uri { font-size: 12px; color: var(--muted); }
.ehead .title { font-size: 20px; font-weight: 700; margin: 2px 0; }
.def { font-size: 13px; color: #344054; margin: 6px 0; }
.mondo { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-right: 6px; }
.ctx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.ctx .box { background: #fafbfc; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; }
.ctx .box b { display: block; font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.syn { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: #fff; }
.syn.decided { border-left: 4px solid var(--ok); } .syn.rejected { border-left: 4px solid var(--bad); }
.syn.flagged { border-left: 4px solid var(--warn); }
.syn .text { font-size: 15px; font-weight: 600; }
.syn .meta { font-size: 12px; color: var(--muted); margin: 3px 0 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.meter { letter-spacing: 1px; color: var(--ok); font-size: 11px; }
.meter i { color: #d0d5dd; font-style: normal; }
.decide { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.decide button { border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 3px 10px; font-size: 12px; }
.decide button.on.accept, .decide button.on.variant, .decide button.on.narrower, .decide button.on.edit { background: var(--ok); border-color: var(--ok); color: #fff; }
.decide button.on.reject { background: var(--bad); border-color: var(--bad); color: #fff; }
.decide button.on.flag { background: var(--warn); border-color: var(--warn); color: #fff; }
.decide button.on.skip { background: #9e9e9e; border-color: #9e9e9e; color: #fff; }
.variants { font-size: 12px; margin-top: 4px; }
.variants button { border: 1px dashed #9db6d1; background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 1px 9px; font-size: 12px; margin: 2px 4px 0 0; }
.variants button.chosen { border-style: solid; background: var(--brand); color: #fff; }
.extra { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.extra input, .extra textarea { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font-size: 12px; }
.rej { font-size: 12px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 2px 12px; }
.rej .r { color: var(--muted); }

/* forms */
.form { display: grid; grid-template-columns: 180px 1fr; gap: 10px 16px; align-items: start; max-width: 860px; }
.form label { font-weight: 600; padding-top: 5px; }
.form input[type=text], .form input[type=email], .form select, .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
.form .help { font-size: 12px; color: var(--muted); margin-top: 3px; }
.consent { background: #fafbfc; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 13px; }
.consent ul { margin: 6px 0 6px 18px; padding: 0; }

/* acknowledgements */
.ackch { margin-bottom: 18px; }
.ackch h3 { font-size: 14px; margin: 0 0 6px; color: var(--brand); }
.person { display: grid; grid-template-columns: 240px 280px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.person a { text-decoration: none; }

/* v4 additions */
.status { font-size: 12px; color: var(--muted); margin-left: 8px; }
.status.err { color: var(--bad); } .status.ok { color: var(--ok); }
.locked { opacity: .65; }
.banner { padding: 10px 20px; font-size: 13px; }
.banner.err { background: var(--bad-soft); color: var(--bad); } .banner.info { background: var(--info-soft); color: var(--info); }
.copy { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; }
.hidden { display: none !important; }

/* two-step review */
.syn.pending { border-left: 4px solid var(--info); }
.step { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
.stephead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
.relbtns, .confbtns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
.relbtns button, .confbtns button { border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 3px 10px; font-size: 12px; }
.confbtns button { min-width: 30px; }
.relbtns button.on, .confbtns button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.relbtns button:focus-visible, .confbtns button:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
.firstmark { font-size: 10px; opacity: .75; margin-left: 5px; }
.stepnext { margin-top: 6px; gap: 10px; }
.expl { background: var(--brand-soft); border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-size: 13px; }
.expl summary { cursor: pointer; }
.expl p { margin: 6px 0; } .expl ul { margin: 2px 0 6px; padding-left: 20px; }
.expl .watch { color: var(--warn); }
.answers { margin-top: 8px; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--info); text-decoration: underline; padding: 0 2px; font-size: 12px; }

</style>
</head>

ransmission is by vertical transmission.","mms_code":"1A60","chapters_all":["01","14","16","17","19"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#587996426","existing":["congenital syphilis, unspecified","hereditary syphilis","heredosyphilis"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"455894495","title":"Syphilis"},{"id":"911707612","title":"Infections of the fetus or newborn"}],"mondo":{"MONDO:0005714":{"label":"congenital syphilis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-OD2VPS56FO","text":"mother-to-child transmission of syphilis","mondo":"MONDO:0005714","source":"Orphanet","source_id":"Orphanet:499009","confidence":4,"cf":{"rel":"broader","target":"455894495","target_title":"Syphilis","level":"FlexiMatch","score":0.492},"variants":[]},{"id":"MSY-EFV7Q5XBCD","text":"MTCT of syphilis","mondo":"MONDO:0005714","source":"Orphanet","source_id":"Orphanet:499009","confidence":4,"cf":{"rel":"broader","target":"455894495","target_title":"Syphilis","level":"FlexiMatch","score":0.663},"variants":[]}],"rejected":[{"text":"congenital syphilis","mondo":"MONDO:0005714","reason":"Only a case mismatch","detail":""}]},{"id":"1326582778","title":"Conidiobolomycosis","fsn":"","definition":"Conidiobolomycosis is a subcutaneous infection involving nasal mucosa and paranasal sinuses, leading to formation of firm, subcutaneous nodules or polyps. The infection may be acquired via inhalation of spores or a minor trauma such as an insect bite. The infected host is frequently an otherwise healthy individual working outdoors in tropical areas. Conidiobolomycosis can, however, cause major facial disfigurement. In individuals with impaired immune responses more invasive and potentially fatal infections may occur: such infections are not usually associated with skin lesions.","mms_code":"1F26","chapters_all":["01","14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1326582778","existing":["Entomophthoromycosis conidiobolae","Rhinoentomophthoromycosis"],"narrower":[],"inclusions":["Rhinoentomophthoromycosis"],"exclusions":[],"parents":[{"id":"1939815950","title":"Mycoses"},{"id":"225063285","title":"Subcutaneous mycoses"}],"mondo":{"MONDO:0000303":{"label":"conidiobolomycosis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-GDY54F3H35","text":"Conidiobolus infectious disease","mondo":"MONDO:0000303","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"rootfallback","target":"1435254666","target_title":"Certain infectious or parasitic diseases","level":"FlexiMatch","score":0.534},"variants":[]}],"rejected":[{"text":"infection by Conidiobolus","mondo":"MONDO:0000303","reason":"Contains invalid substring","detail":"infection by "}]},{"id":"1282509430","title":"Creeping myiasis","fsn":"","definition":"A form of migratory cutaneous myiasis caused by larvae of certain species of Gasterophilus, the horse bot-fly. It resembles cutaneous larva migrans.","mms_code":"1G01.3","chapters_all":["01","14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1282509430","existing":[],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"1342682193","title":"Cutaneous myiasis"}],"mondo":{"MONDO:0018857":{"label":"creeping myiasis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-JOI3WEQGA7","text":"migratory myiasis","mondo":"MONDO:0018857","source":"Orphanet","source_id":"Orphanet:504","confidence":4,"cf":{"rel":"unrelated","target":"1367149207","target_title":"Myiasis","level":"FlexiMatch","score":0.751},"variants":[]}],"rejected":[]},{"id":"1562906700","title":"Crimean-Congo haemorrhagic fever","fsn":"","definition":"A disease caused by an infection with Crimean-Congo haemorrhagic fever virus.\n\nThe length of the incubation period depends on the mode of acquisition of the virus. Following infection by a tick bite, the incubation period is usually one to three days, with a maximum of nine days. The incubation period following contact with infected blood or tissues is usually five to six days, with a documented maximum of 13 days.\n\nOnset of symptoms is sudden, with fever, myalgia, (muscle ache), dizziness, neck pain and stiffness, backache, headache, sore eyes and photophobia (sensitivity to light). There may be nausea, vomiting, diarrhoea, abdominal pain and sore throat early on, followed by sharp mood swings and confusion. After two to four days, the agitation may be replaced by sleepiness, depression and lassitude, and the abdominal pain may localize to the upper right quadrant, with detectable hepatomegaly (liver enlargement).\n\nOther clinical signs include tachycardia (fast heart rate), lymphadenopathy (enlarged lymph nodes), and a petechial rash (a rash caused by bleeding into the skin) on internal mucosal surfaces, such as in the mouth and throat, and on the skin. The petechiae may give way to larger rashes called ecchymoses, and other haemorrhagic phenomena. There is usually evidence of hepatitis, and severely ill patients may experience rapid kidney deterioration, sudden liver failure or pulmonary failure after the fifth day of illness.\n\nThe mortality rate from CCHF is approximately 30%, with death occurring in the second week of illness. In patients who recover, improvement generally begins on the ninth or tenth day after the onset of illness.\n\nThe CCHF virus is transmitted to people either by tick bites or through contact with infected animal blood or tissues during and immediately after slaughter. The majority of cases have occurred in people involved in the livestock industry, such as agricultural workers, slaughterhouse workers and veterinarians. Human-to-human transmission can occur resulting from close contact with the blood, secretions, organs or other bodily fluids of infected persons. Hospital-acquired infections can also occur due to improper sterilization of medical equipment, reuse of needles and contamination of medical supplies.\n\nLaboratory diagnosis of the infection during the acute phase of illness consists of detection of viral nucleic acid or or by demonstration of viral antigen by enzyme-linked immunoassay from serum or plasma samples. In samples collected later during the illness, diagnosis is confirmed by demonstration of specific IgG and IgM antibodies.","mms_code":"1D49","chapters_all":["01"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1562906700","existing":["CCHF - [Crimean-Congo haemorrhagic fever]","Kara mikh typhoid fever","Xīnjiāng haemorrhagic fever"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"921595235","title":"Certain arthropod-borne viral fevers"}],"mondo":{"MONDO:0020501":{"label":"Crimean-Congo hemorrhagic fever","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-73NTSBNPLS","text":"Congo fever","mondo":"MONDO:0020501","source":"Orphanet","source_id":"Orphanet:99827","confidence":4,"cf":{"rel":"unrelated","target":"915343154","target_title":"Fever of other or unknown origin","level":"FlexiMatch","score":0.592},"variants":[]},{"id":"MSY-K6LSBLAHSA","text":"Congo hemorrhagic fever","mondo":"MONDO:0020501","source":"Orphanet","source_id":"Orphanet:99827","confidence":4,"cf":{"rel":"confirmed"},"variants":[]},{"id":"MSY-BKA3A6OU2Y","text":"Crimean hemorrhagic fever","mondo":"MONDO:0020501","source":"DOID + Orphanet","source_id":"DOID:12287 + Orphanet:99827","confidence":5,"cf":{"rel":"confirmed"},"variants":[]}],"rejected":[{"text":"CCHF","mondo":"MONDO:0020501","reason":"No vowels","detail":""},{"text":"Congo-Crimean hemorrhagic fever","mondo":"MONDO:0020501","reason":"Matches an existing normalized synonym","detail":""},{"text":"Crimean hemorrhagic fever [CHF Congo virus]","mondo":"MONDO:0020501","reason":"Contains invalid substring","detail":"["},{"text":"Crimean-Congo haemorrhagic fever","mondo":"MONDO:0020501","reason":"Synonym already in ICD","detail":""}]},{"id":"390527954","title":"Cryptococcosis","fsn":"","definition":"A disease caused by an infection with the fungi Cryptococcus neoformans or Cryptococcus gattii. This disease commonly presents with shortness of breath, cough, fever, fatigue, or headache. Transmission is by inhalation of fungal spores. Confirmation is by identification of Cryptococcus neoformans or Cryptococcus gattii in a blood, sputum, or cerebrospinal fluid sample.","mms_code":"1F27","chapters_all":["01"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#390527954","existing":["European blastomycoses infection","European blastomycosis","European blastomycotic infection","cryptococcosis infection","cryptococcus neoformans infection","torula histolytica infection","torulosis"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"1939815950","title":"Mycoses"}],"mondo":{"MONDO:0005724":{"label":"cryptococcosis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-F53TO4Y6OQ","text":"Cryptococcus neoformans infectious disease","mondo":"MONDO:0005724","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"confirmed"},"variants":[]}],"rejected":[{"text":"Cryptococcus neoformans caused disease or disorder","mondo":"MONDO:0005724","reason":"Contains invalid substring","detail":" disease or disorder"},{"text":"Cryptococcus neoformans disease or disorder","mondo":"MONDO:0005724","reason":"Contains invalid substring","detail":" disease or disorder"},{"text":"torulosis","mondo":"MONDO:0005724","reason":"Synonym already in ICD","detail":""}]},{"id":"1837013982","title":"Cryptosporidiosis","fsn":"","definition":"Any condition caused by an infection with the protozoan parasite Cryptosporidium.","mms_code":"1A32","chapters_all":["01"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1837013982","existing":["cryptosporidial infection","gastroenteritis due to cryptosporidium","intestinal cryptosporidiosis"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"2092703582","title":"Protozoal intestinal infections"}],"mondo":{"MONDO:0015474":{"label":"cryptosporidiosis","cf":{"rel":"conf iasis"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"1082373067","title":"Leishmaniasis"},{"id":"950336322","title":"Certain protozoal infections affecting the skin"}],"mondo":{"MONDO:0005446":{"label":"cutaneous leishmaniasis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-Q6XUI5DMUN","text":"Asian desert cutaneous leishmaniasis","mondo":"MONDO:0005446","source":"DOID + NCIT","source_id":"DOID:9111 + NCIT:C34770","confidence":4,"cf":{"rel":"confirmed"},"variants":[]},{"id":"MSY-NCFIXHSRO3","text":"zone of skin leishmaniasis","mondo":"MONDO:0005446","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"broader","target":"1082373067","target_title":"Leishmaniasis","level":"FlexiMatch","score":0.649},"variants":[]}],"rejected":[]},{"id":"833744511","title":"Cyclosporiasis","fsn":"","definition":"Cyclosporosis is a parasitic disease caused by Cyclospora cayetanensis that occurs through ingestion of contaminated food or water and leads to abdominal pain, anorexia and diarrhoea, which may resolve spontaneously in immunocompetent individuals but may persist in a chronic form in immunocompromised subjects, leading to a decline in their general state of health.\nAn emerging gastro-enteric disease caused by the coccidia protozoan Cyclospora cayetanensis, a pathogen transmitted by faeces or faeces-contaminated fresh produce and water. It is associated with diarrhoea among children in developing countries.","mms_code":"1A3Y","chapters_all":["01"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#833744511","existing":["Cyclosporosis"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"2092703582","title":"Protozoal intestinal infections"}],"mondo":{"MONDO:0005725":{"label":"cyclosporiasis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-AXT35R3OMY","text":"Cyclospora cayetanensis infectious disease","mondo":"MONDO:0005725","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"unr severe illness or death.\nWhen it is symptomatic, the onset of the disease is usually gradual, starting with fever, general weakness headache and malaise. After a few days, sore throat, muscle pain, chest pain, nausea, vomiting, diarrhoea, cough and abdominal pain may follow. As the disease progresses, in severe cases facial swelling, fluid in the lung cavity, bleeding from the mouth, nose, vagina or gastrointestinal tract and low blood pressure may develop. Shock, seizures, tremor, disorientation, and coma may be seen in the later stages. Among hospitalized patients, approximately 15% die of Lassa fever disease. In fatal cases, death usually occurs within 14 days of symptom onset.\nDuring pregnancy, Lassa fever can cause high maternal and foetal mortality, especially late in pregnancy. In the third trimester, fetal death and maternal death rates can exceed 80% and 30% respectively.\nProlonged convalescence in some patients has been documented leading sometimes to sequelae. Sudden hearing loss has been reported with varying incidence and up to 25% of recovered patients, both during acute disease and after recovery. In most circumstances hearing loss is reported to be permanent. Other sequelae including neurological signs, visual impairment, joint pain, transient hair loss and psychological disorders have been reported to a lesser extent.\nThe incubation period of Lassa fever ranges from 2–21 days.\nTransmission occurs either through exposure to food or household items that are contaminated with urine or faeces of infected Mastomys rat, or directly via contact with infected rats.\nAlthough to a much less extent, Lassa virus may also spread between humans through direct contact with blood, urine, faeces or other bodily secretions of a person infected with Lassa fever. Person-to-person transmission may occur primarily in health-care settings, where the virus may also be spread by contaminated medical equipment, such as re-used needles.\nDiagnosis occurs by identificati
