<title>Chapter 14 Review</title>
<meta name="description" content="Expert review of Mondo-derived synonym proposals for the ICD-11 Foundation, release v20261030.">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #667085; --line: #e3e6eb;
  --brand: #1f4e79; --brand-soft: #e8f0f8; --accent: #a6ce39;  /* ORCID green */
  --ok: #2e7d32; --ok-soft: #e8f5e9; --bad: #c62828; --bad-soft: #ffebee;
  --warn: #b26a00; --warn-soft: #fff4e0; --info: #1565c0; --info-soft: #e3f2fd;
  --mock: #5b21b6; --mock-soft: #f3e8ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; min-width: 1100px; }
a { color: var(--info); }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
input, select, textarea { font: inherit; }

header.top { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 52px; }
header.top .brand { font-weight: 700; font-size: 15px; }
header.top nav a { color: #dce7f2; text-decoration: none; margin-right: 18px; padding: 15px 0; border-bottom: 3px solid transparent; }
header.top nav a.on { color: #fff; border-color: var(--accent); }
header.top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.chip { background: rgba(255,255,255,.14); border-radius: 12px; padding: 2px 10px; font-size: 12px; }
.badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; text-align: center; margin-left: 4px; }
.orcid-btn { background: #fff; color: #333; border: 0; border-radius: 4px; padding: 5px 10px; display: flex; gap: 6px; align-items: center; }
.idicon { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 9px/16px sans-serif; justify-content: center; vertical-align: -3px; }

main { padding: 20px; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 22px 0 8px; }
.lead { color: var(--muted); margin: 0 0 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 14px; }
.note { background: var(--info-soft); border-left: 3px solid var(--info); padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 8px 0; }
.note.warn { background: var(--warn-soft); border-color: var(--warn); }
.note.mock { background: var(--mock-soft); border-color: var(--mock); color: var(--mock); }
table.grid { width: 100%; border-collapse: collapse; background: var(--panel); }
table.grid th, table.grid td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grid th { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: #fafbfc; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.pill { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--info-soft); color: var(--info); }
.pill.grey { background: #eef0f3; color: #555; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 12px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.row { display: flex; gap: 12px; align-items: center; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: none; padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--brand); border-color: var(--brand); font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.switch input { width: 30px; height: 16px; }

/* review page */
.review { display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
.elist { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: start; }
.elist .item { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; cursor: pointer; }
.elist .item.sel { background: var(--brand-soft); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #cfd4dc; flex: none; }
.dot.part { background: #f0b429; } .dot.done { background: var(--ok); }
.cfdot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
.cfdot.sev2 { background: var(--bad); }
/* CodeFusion overlay (relation pills as in v3) */
.cf { display: inline-block; white-space: nowrap; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
.cf.confirmed { background: var(--ok-soft); color: var(--ok); }
.cf.broader, .cf.narrower { background: var(--info-soft); color: var(--info); }
.cf.sibling { background: #ede7f6; color: #5e35b1; }
.cf.unrelated { background: var(--bad-soft); color: var(--bad); }
.cf.nomatch, .cf.rootfallback { background: #eef0f3; color: #555; }
.syn.contested { background: #fff8f8; }
.cflegend { background: #fafbfc; border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 12px; margin: 6px 0; }
.cfbanner { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-top: 10px; }
.cfbanner.ok { background: var(--ok-soft); } .cfbanner.bad { background: var(--warn-soft); border-left: 3px solid var(--warn); }
.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal .box { background: #fff; border-radius: 10px; max-width: 760px; max-height: 85vh; overflow: auto; padding: 18px 22px; }
.modal h3 { font-size: 14px; margin: 14px 0 4px; }
.modal .keypt { background: var(--warn-soft); border-left: 3px solid var(--warn); padding: 6px 10px; font-size: 13px; }
.elist .lbl { flex: 1; } .elist .sub { font-size: 11px; color: var(--muted); }
.ehead .uri { font-size: 12px; color: var(--muted); }
.ehead .title { font-size: 20px; font-weight: 700; margin: 2px 0; }
.def { font-size: 13px; color: #344054; margin: 6px 0; }
.mondo { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 4px; padding: 0 6px; font-size: 12px; margin-right: 6px; }
.ctx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.ctx .box { background: #fafbfc; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px; }
.ctx .box b { display: block; font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.syn { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: #fff; }
.syn.decided { border-left: 4px solid var(--ok); } .syn.rejected { border-left: 4px solid var(--bad); }
.syn.flagged { border-left: 4px solid var(--warn); }
.syn .text { font-size: 15px; font-weight: 600; }
.syn .meta { font-size: 12px; color: var(--muted); margin: 3px 0 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.meter { letter-spacing: 1px; color: var(--ok); font-size: 11px; }
.meter i { color: #d0d5dd; font-style: normal; }
.decide { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.decide button { border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 3px 10px; font-size: 12px; }
.decide button.on.accept, .decide button.on.variant, .decide button.on.narrower, .decide button.on.edit { background: var(--ok); border-color: var(--ok); color: #fff; }
.decide button.on.reject { background: var(--bad); border-color: var(--bad); color: #fff; }
.decide button.on.flag { background: var(--warn); border-color: var(--warn); color: #fff; }
.decide button.on.skip { background: #9e9e9e; border-color: #9e9e9e; color: #fff; }
.variants { font-size: 12px; margin-top: 4px; }
.variants button { border: 1px dashed #9db6d1; background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 1px 9px; font-size: 12px; margin: 2px 4px 0 0; }
.variants button.chosen { border-style: solid; background: var(--brand); color: #fff; }
.extra { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.extra input, .extra textarea { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; font-size: 12px; }
.rej { font-size: 12px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 2px 12px; }
.rej .r { color: var(--muted); }

/* forms */
.form { display: grid; grid-template-columns: 180px 1fr; gap: 10px 16px; align-items: start; max-width: 860px; }
.form label { font-weight: 600; padding-top: 5px; }
.form input[type=text], .form input[type=email], .form select, .form textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
.form .help { font-size: 12px; color: var(--muted); margin-top: 3px; }
.consent { background: #fafbfc; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 13px; }
.consent ul { margin: 6px 0 6px 18px; padding: 0; }

/* acknowledgements */
.ackch { margin-bottom: 18px; }
.ackch h3 { font-size: 14px; margin: 0 0 6px; color: var(--brand); }
.person { display: grid; grid-template-columns: 240px 280px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.person a { text-decoration: none; }

/* v4 additions */
.status { font-size: 12px; color: var(--muted); margin-left: 8px; }
.status.err { color: var(--bad); } .status.ok { color: var(--ok); }
.locked { opacity: .65; }
.banner { padding: 10px 20px; font-size: 13px; }
.banner.err { background: var(--bad-soft); color: var(--bad); } .banner.info { background: var(--info-soft); color: var(--info); }
.copy { width: 100%; font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; }
.hidden { display: none !important; }

/* two-step review */
.syn.pending { border-left: 4px solid var(--info); }
.step { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
.stephead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
.relbtns, .confbtns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
.relbtns button, .confbtns button { border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 3px 10px; font-size: 12px; }
.confbtns button { min-width: 30px; }
.relbtns button.on, .confbtns button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.relbtns button:focus-visible, .confbtns button:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
.firstmark { font-size: 10px; opacity: .75; margin-left: 5px; }
.stepnext { margin-top: 6px; gap: 10px; }
.expl { background: var(--brand-soft); border-radius: 6px; padding: 8px 12px; margin-top: 8px; font-size: 13px; }
.expl summary { cursor: pointer; }
.expl p { margin: 6px 0; } .expl ul { margin: 2px 0 6px; padding-left: 20px; }
.expl .watch { color: var(--warn); }
.answers { margin-top: 8px; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--info); text-decoration: underline; padding: 0 2px; font-size: 12px; }

</style>

l":""}]},{"id":"1978274002","title":"Cytophagic histiocytic panniculitis","fsn":"","definition":"Cytophagic histiocytic panniculitis is a very rare form of panniculitis manifesting as recurrent multiple subcutaneous nodules (which may progressively become ecchymotic and ulcerated), and histologically characterised by lobular panniculitis with lymphocytic and histiocytic infiltration in the subcutaneous adipose tissue. The histiocytic infiltration often involves lymph nodes, bone marrow and other tissues of the reticuloendothelial system. Severe fever, malaise, pancytopenia, hepatosplenomegaly, and mucosal ulcers are common systemic symptoms. The aetiology remains unclear.","mms_code":"EE8Y","chapters_all":["14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1978274002","existing":[],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"435152554","title":"Miscellaneous specified, Class IIb non-Langerhans cell histiocytoses involving the skin"},{"id":"1056888958","title":"Panniculitis"}],"mondo":{"MONDO:0019789":{"label":"cytophagic histiocytic panniculitis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-2EHNFFQP7Q","text":"Winkelmann cytophagic panniculitis","mondo":"MONDO:0019789","source":"Orphanet","source_id":"Orphanet:94087","confidence":4,"cf":{"rel":"confirmed"},"variants":[]}],"rejected":[{"text":"CHP","mondo":"MONDO:0019789","reason":"No vowels","detail":""}]},{"id":"286313127","title":"Dermatitis herpetiformis","fsn":"","definition":"Dermatitis herpetiformis is an immunobullous skin characterised by recurrent eruptions of intensely itchy papules, vesicles or bullae, which are typically grouped symmetrically on the extensor surfaces of the limbs and on the buttocks and back. The primary lesions are frequently obscured by excoriation. An incompletely understood abnormal response to dietary gluten provokes the formation of autoantibodies to tissue and epidermal transglutaminases and granular deposition of IgA in dermal papillae. The disease is strongly associated with gluten-sensitive enteropathy, which can range from mild jejunal epithelial inflammation to total villous atrophy (coeliac disease).","mms_code":"EB44","chapters_all":["14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#286313127","existing":["DH - [dermatitis herpetiformis]","Duhring–Brocq disease"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"721319964","title":"Immunobullous diseases of the skin"}],"mondo":{"MONDO:0015614":{"label":"dermatitis herpetiformis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-OFMHUEZD3K","text":"Duhring's disease","mondo":"MONDO:0015614","source":"DOID","source_id":"DOID:8505","confidence":3,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]},{"id":"MSY-VBPX4DK5MD","text":"Durhing-Brocq disease","mondo":"MONDO:0015614","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]}],"rejected":[{"text":"dermatitis herpetiformis","mondo":"MONDO:0015614","reason":"Only a case mismatch","detail":""}]},{"id":"1305138145","title":"Dermochondrocorneal dystrophy","fsn":"","definition":"Dermochondrocorneal dystrophy is a rare autosomal recessive genetic disorder characterised by abnormalities in the skin, the bones of the extremities and the corneae. Nodules resembling xanthomata develop over the dorsa of the fingers, the tips of the elbows and on the nose and ears; their histogenesis is unclear but may be due to anomalous control of fibroblast or chondrocyte proliferation and secretion. Deformities of the hands and feet result from abnormal ossification of cartilage. Additionally, anterior central opacities develop in the corneae.","mms_code":"EC4Y","chapters_all":["09","14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1305138145","existing":[],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"749233960","title":"Syndromic corneal dystrophy"},{"id":"2085581957","title":"Genetic disorders affecting dermal collagen, elastin or other matrix proteins"}],"mondo":{"MONDO:0009094":{"label":"dermochondrocorneal dystrophy","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-TMYHGBLB26","text":"FranC'ois syndrome","mondo":"MONDO:0009094","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]},{"id":"MSY-A3QNMHOVLO","text":"François syndrome","mondo":"MONDO:0009094","source":"Orphanet","source_id":"Orphanet:79149","confidence":4,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]}],"rejected":[{"text":"dermochondrocorneal dystrophy","mondo":"MONDO:0009094","reason":"Only a case mismatch","detail":""}]},{"id":"1259583500","title":"Diffuse palmoplantar keratodermas","fsn":"","definition":"Palmoplantar keratoderma in which there is confluent epidermal thickening affecting the palms and soles.","mms_code":"EC20.30","chapters_all":["14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1259583500","existing":[],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"1941547119","title":"Hereditary palmoplantar keratodermas"}],"mondo":{"MONDO:0017666":{"label":"diffuse palmoplantar keratoderma","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-C5TCM4Z43Y","text":"diffuse keratosis palmoplantaris","mondo":"MONDO:0017666","source":"Orphanet","source_id":"Orphanet:307141","confidence":4,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]},{"id":"MSY-VCOT3KRJHA","text":"diffuse palmoplantar hyperkeratosis","mondo":"MONDO:0017666","source":"Orphanet","source_id":"Orphanet:307141","confidence":4,"cf":{"rel":"unrelated","target":"1205950456","target_title":"Palmoplantar keratodermas","level":"FlexiMatch","score":0.855},"variants":[]},{"id":"MSY-GX7GTXJQWA","text":"diffuse PPK","mondo":"MONDO:0017666","source":"Orphanet","source_id":"Orphanet:307141","confidence":4,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]}],"rejected":[]},{"id":"872245808","title":"Dissecting cellulitis","fsn":"","definition":"Dissecting cellulitis is a destructive inflammatory disorder of the scalp characterised by widespread perifolliculitis with dermal abscess and sinus tract formation and extensive scarring. It occurs predominantly in black males aged between 18 and 40 years. It may be associated with hidradenitis suppurativa and acne conglobata (follicular occlusion triad), and with pilonidal sinus. Painful swellings develop around the vertex of the scalp and coalesce to form irregular undulating oedematous ridges and furrows. With time an extensive network of sinuses discharging pus may develop. Progressive scarring and permanent alopecia ensue.","mms_code":"ED70.51","chapters_all":["14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#872245808","existing":["Perifolliculitis capitis abscedens et suffodiens","perifolliculitis NOS"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"2056855330","title":"Scarring alopecia due to inflammatory disorders"}],"mondo":{"MONDO:0009848":{"label":"dissecting cellulitis of the scalp","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-55P2IP7JWK","text":"dissecting cellulitis of the scalp","mondo":"MONDO:0009848","source":"OMIM + Orphanet","source_id":"OMIM:260910 + Orphanet:345","confidence":5,"cf":{"rel":"confirmed"},"variants":[]}],"rejected":[]},{"id":"15123132","title":"Dowling-Degos disease","fsn":"","definition":"Dowling-Degos disease is a rare autosomal dominant condition which usually presents post-pubertally with multiple small, round pigmented freckle-like macules. They become progressively more numerous and may become reticulate with time. The axillae and groins are the usual sites, although other areas may be involved, including the intergluteal and inframammary folds, neck, scalp, trunk, arms and genitalia. Pigmentation is symmetrical and progressive, but is otherwise asymptomatic.","mms_code":"EC23.0","chapters_all":["14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#15123132","existing":["Reticulate pigmented anomaly of the flexures"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"1654612170","title":"Non-syndromic genetically-determined hypermelanosis or lentiginosis"}],"mondo":{"MONDO:0008371":{"label":"Dowling-Degos disease","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-H6WGNV7HYF","text":"Dowling-Degos disease type 1","mondo":"MONDO:0008371","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"confirmed"},"variants":[]},{"id":"MSY-64VHNHRZDZ","text":"reticular pigment anomaly of flexures","mondo":"MONDO:0008371","source":"DOID + Orphanet","source_id":"DOID:0060256 + Orphanet:79145","confidence":5,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]}],"rejected":[]},{"id":"516577496","title":"DRESS syndrome","fsn":"","definition":"DRESS syndrome (Drug Rash with Eosinophilia and Systemic Symptoms) is a hypersensitivity reaction characterised by a generalised skin rash, fever, eosinophilia, lymphocytosis and visceral involvement (hepatitis, nephritis, pneumonitis, pericarditis and myocarditis) and, in some patients, reactivation of human herpes virus 6.","mms_code":"EH65","chapters_all":["04","14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#516577496","existing":["DIHS - [drug-induced hypersensitivity syndrome]","Drug rash with eosinophilia and systemic symptoms","Drug-induced hypersensitivity syndrome"],"narrower":[],"inclusions":["Drug-induced hypersensitivity syndrome"],"exclusions":[],"parents":[{"id":"923546127","title":"Drug eruptions"}],"mondo":{"MONDO:0015340":{"label":"drug rash with eosinophilia and systemic symptoms","cf":{"rel":"confirmed"}}},"proposa }]},{"id":"450167795","title":"Stevens-Johnson syndrome","fsn":"","definition":"Stevens-Johnson syndrome is an immune-complex–mediated hypersensitivity disorder involving mucous membranes (conjunctivae, oral mucosa and genital mucosa) with, by definition, skin involvement limited to no more than 9% body surface area. It is related to toxic epidermal necrolysis and shares many of the same triggers, notably drugs, but the inflammation is centred on and close to mucosal surfaces. Although mortality is low, acute morbidity is high and conjunctival involvement has the potential to cause blindness.","mms_code":"EB13.0","chapters_all":["13","14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#450167795","existing":[],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"371242799","title":"Noninfectious erosive or ulcerative disorders of oral mucosa"},{"id":"195467267","title":"Stevens-Johnson syndrome or toxic epidermal necrolysis"}],"mondo":{"MONDO:0018229":{"label":"Stevens-Johnson syndrome","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-KYCKQ3PTME","text":"Dermatostomatitis, Stevens Johnson type","mondo":"MONDO:0018229","source":"Orphanet","source_id":"Orphanet:36426","confidence":4,"cf":{"rel":"confirmed"},"variants":[]}],"rejected":[{"text":"Stevens Johnson syndrome","mondo":"MONDO:0018229","reason":"Matches an existing normalized synonym","detail":""}]},{"id":"195467267","title":"Stevens-Johnson syndrome or toxic epidermal necrolysis","fsn":"","definition":"A spectrum of severe and life-threatening hypersensitivity disorders affecting skin and mucous membranes, most commonly precipitated by an idiosyncratic reaction to medication. Stevens-Johnson syndrome (SJS) always involves mucosal surfaces but the skin involvement is limited by definition to <10% body surface area (BSA). Toxic epidermal necrolysis (TEN) may sometimes spare mucous membranes but skin involvement is by definition >30% BSA. An intermediate form is recognised in which mucosal involvement is accompanied by skin involvement of 10-30% BSA (SJS-TEN overlap syndrome). All forms result in extensive sloughing and ulceration and carry a significant risk of fatal outcome.","mms_code":"EB13","chapters_all":["14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#195467267","existing":["SJS/TEN - [Stevens-Johnson syndrome and toxic epidermal necrolysis]"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"730479772","title":"Inflammatory erythemas and other reactive inflammatory dermatoses"}],"mondo":{"MONDO:0019810":{"label":"toxic epidermal necrolysis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-CKH34ZTQKN","text":"toxic epidermolysis","mondo":"MONDO:0019810","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]}],"rejected":[{"text":"SJS-TEN","mondo":"MONDO:0019810","reason":"All uppercase letters","detail":""},{"text":"TEN","mondo":"MONDO:0019810","reason":"Short word","detail":""}]},{"id":"1171134598","title":"Striate palmoplantar keratoderma","fsn":"","definition":"","mms_code":"EC20.31","chapters_all":["14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1171134598","existing":["Brunauer-Fuhs-Siemens keratoderma","Keratoderma palmoplantaris striata"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"2018231993","title":"Non-syndromic nummular or linear palmoplantar keratodermas"}],"mondo":{"MONDO:0018865":{"label":"striate palmoplantar keratoderma","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-5WWMNV5C2E","text":"keratosis palmoplantaris striata","mondo":"MONDO:0018865","source":"DOID + Orphanet","source_id":"DOID:0081105 + Orphanet:50942","confidence":5,"cf":{"rel":"confirmed"},"variants":[]},{"id":"MSY-EOKIKUKRSH","text":"keratosis palmoplantaris striata et areata","mondo":"MONDO:0018865","source":"Orphanet","source_id":"Orphanet:50942","confidence":4,"cf":{"rel":"noma ower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"304883627","title":"Waardenburg syndrome"}],"mondo":{"MONDO:0008670":{"label":"Waardenburg syndrome type 1","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-WNJ2CDHNYL","text":"Waardenburg syndrome type I","mondo":"MONDO:0008670","source":"DOID + NCIT + Orphanet","source_id":"DOID:0110948 + NCIT:C75008 + Orphanet:894","confidence":5,"cf":{"rel":"broader","target":"304883627","target_title":"Waardenburg syndrome","level":"FlexiMatch","score":0.614},"variants":[]}],"rejected":[{"text":"Waardenburg syndrome type 1","mondo":"MONDO:0008670","reason":"Synonym already in ICD","detail":""},{"text":"WS1","mondo":"MONDO:0008670","reason":"No vowels","detail":""}]},{"id":"746815303","title":"Waardenburg syndrome type 2","fsn":"","definition":"This type resembles type 1 except that dystopia canthorum is absent. It is caused by mutations in MITF/SNAI2 genes.","mms_code":"EC23.2Y","chapters_all":["09","14","20"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#746815303","existing":[],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"304883627","title":"Waardenburg syndrome"}],"mondo":{"MONDO:0019517":{"label":"Waardenburg syndrome type 2","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-IW2XXV7KUP","text":"Waardenburg syndrome type II","mondo":"MONDO:0019517","source":"NCIT + Orphanet","source_id":"NCIT:C75009 + Orphanet:895","confidence":5,"cf":{"rel":"broader","target":"304883627","target_title":"Waardenburg syndrome","level":"FlexiMatch","score":0.591},"variants":[]}],"rejected":[{"text":"Waardenburg syndrome type 2","mondo":"MONDO:0019517","reason":"Synonym already in ICD","detail":""},{"text":"WS2","mondo":"MONDO:0019517","reason":"No vowels","detail":""}]},{"id":"847608197","title":"Waardenburg syndrome type 3","fsn":"","definition":"This type is caused by mutations in PAX3 and is phenotypically similar to type 1 with the additional feature of limb abnormalities.","mms_code":"EC23.2Y","chapters_all":["09","14","20"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#847608197","existing":[],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"304883627","title":"Waardenburg syndrome"}],"mondo":{"MONDO:0007862":{"label":"Waardenburg syndrome type 3","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-GXLNRLAXJN","text":"Klein-Waardenburg syndrome","mondo":"MONDO:0007862","source":"DOID + OMIM + Orphanet","source_id":"DOID:0110949 + OMIM:148820 + Orphanet:896","confidence":5,"cf":{"rel":"broader","target":"304883627","target_title":"Waardenburg syndrome","level":"FlexiMatch","score":0.535},"variants":[]},{"id":"MSY-2AUTRTXPOR","text":"Waardenburg syndrome type III","mondo":"MONDO:0007862","source":"DOID + Orphanet","source_id":"DOID:0110949 + Orphanet:896","confidence":5,"cf":{"rel":"broader","target":"304883627","target_title":"Waardenburg syndrome","level":"FlexiMatch","score":0.557},"variants":[]}],"rejected":[{"text":"Waardenburg syndrome with limb anomalies","mondo":"MONDO:0007862","reason":"Contains invalid substring","detail":" with "},{"text":"Waardenburg syndrome with upper limb anomalies","mondo":"MONDO:0007862","reason":"Contains invalid substring","detail":" with "},{"text":"WS3","mondo":"MONDO:0007862","reason":"No vowels","detail":""}]},{"id":"1466487054","title":"X-linked ichthyosis","fsn":"","definition":"X-linked ichthyosis is an X-linked recessive genodermatosis associated with steroid sulfatase deficiency and elevated plasma cholesterol sulfate. Generalised scaling is present at or shortly after birth, most prominently over the extremities, neck, trunk, and buttocks. It occurs only in males and may be associated with testicular disease and corneal opacities.","mms_code":"EC20.01","chapters_all":["05","09","14","20"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1466487054","existing":["Sex-linked ichthyosis","X-linked ichthyosis with steryl-sulfatase deficiency","X-linked recessive ichthyosis"],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"904454178","title":"Other disorders of sterol metabolism"},{"id":"749233960","title":"Syndromic corneal dystrophy"},{"id":"213831678","title":"Non-syndromic ichthyosis"}],"mondo":{"MONDO:0010622":{"label":"recessive X-linked ichthyosis","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-FEC4AHXPAW","text":"ichthyosis , X-linked, X-linked recessive","mondo":"MONDO:0010622","source":"Mondo (no upstream xref)","source_id":"","confidence":2,"cf":{"rel":"confirmed"},"variants":[]},{"id":"MSY-H376TDQGKD","text":"steroid sulfatase deficiency","mondo":"MONDO:0010622","source":"OMIM + Orphanet","source_id":"OMIM:308100 + Orphanet:461","confidence":5,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]}],"rejected":[{"text":"ichthyosis (disease), X-linked","mondo":"MONDO:0010622","reason":"Contains invalid substring","detail":"(disease)"},{"text":"Ichthyosis, X Linked","mondo":"MONDO:0010622","reason":"Matches an existing normalized synonym","detail":""},{"text":"recessive X-linked ichthyosis","mondo":"MONDO:0010622","reason":"Matches an existing normalized synonym","detail":""},{"text":"RXLI","mondo":"MONDO:0010622","reason":"All uppercase letters","detail":""},{"text":"X-linked ichthyosis","mondo":"MONDO:0010622","reason":"Synonym already in ICD","detail":""},{"text":"X-linked recessive ichthyosis","mondo":"MONDO:0010622","reason":"Synonym already in ICD","detail":""},{"text":"XLI","mondo":"MONDO:0010622","reason":"Short word","detail":""}]},{"id":"1785140754","title":"Xanthoma disseminatum","fsn":"","definition":"Xanthoma disseminatum is a rare non-familial disease, characterised by proliferation of histiocytic cells in which lipid deposition is a secondary event. The disease predominantly affects male children and young adults, with involvement of the skin, mucous membranes of eyes and upper respiratory tract, the meninges and rarely other organs including liver, spleen and bone marrow. The skin lesions of xanthoma disseminatum are erythematous, yellow-brown papules and nodules, which are symmetrically distributed on the trunk, face and proximal extremities. The lesions may become confluent, especially in flexures, to form xanthomatous plaques. The disease may persist for many years.","mms_code":"EE81","chapters_all":["14"],"browser":"https://icd.who.int/browse/2026-01/foundation/en#1785140754","existing":[],"narrower":[],"inclusions":[],"exclusions":[],"parents":[{"id":"1966128216","title":"Dermal dendrocyte, Class IIa histiocytoses"}],"mondo":{"MONDO:0015535":{"label":"xanthoma disseminatum","cf":{"rel":"confirmed"}}},"proposals":[{"id":"MSY-VW473AYFSB","text":"Montgomery syndrome","mondo":"MONDO:0015535","source":"Orphanet","source_id":"Orphanet:158003","confidence":4,"cf":{"rel":"nomatch","target":"","target_title":"","level":"NoMatch","score":0.0},"variants":[]}],"rejected":[]}]};

<script>
// Review tool v4: one script for every page. build_site.py inlines it with the chapter index
// (window.INDEX) and, on a chapter page, that chapter's bundle (window.BUNDLE).
// Pages: index.html (#chapters, #ack, #me, #admin, #welcome, #invite=<token>) and <chapter>.html.
'use strict';

const API = new URLSearchParams(location.search).get('api') || window.API_BASE;
const IDX = window.INDEX, B = window.BUNDLE || null;
const SESSION_KEY = 'v4session', CREDITS_KEY = 'v4credits';

// ── helpers ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* private mode */ } },
};
const chTitle = tag => (IDX.chapters.find(c => c.tag === tag) || {}).title || '';
const chLabel = tag => { const c = IDX.chapters.find(x => x.tag === tag); return c ? `${c.chapter} — ${c.title}` : tag; };
const orcidLink = o => o ? `<a href="https://orcid.org/${esc(o)}" target="_blank" rel="noopener"><span class="idicon">iD</span> https://orcid.org/${esc(o)}</a>` : '';
const browserUrl = id => `https://icd.who.int/browse/2026-01/foundation/en#${id}`;
const homeUrl = hash => 'index.html' + (hash ? '#' + hash : '');

async function api(path, opts = {}) {
  const token = store.get(SESSION_KEY);
  const res = await fetch(API + path, { method: opts.method || 'GET',
    headers: { ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (opts.raw) { if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText); return res; }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token) { store.set(SESSION_KEY, null); ME = null; }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function download(path, fallbackName) {
  const res = await api(path, { raw: true });
  const name = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await res.blob());
  a.download = name ? name[1] : fallbackName;
  a.click();
  URL.revokeObjectURL(a.href);
}
function signIn(afterHash, invite) {
  const back = location.href.split('#')[0].replace(/\?.*$/, '') + (afterHash ? '#' + afterHash : '');
  location.href = `${API}/auth/login?return=${encodeURIComponent(back)}${invite ? '&invite=' + encodeURIComponent(invite) : ''}`;
}
async function signOut() {
  try { await api('/auth/logout', { method: 'POST' }); } catch { /* already gone */ }
  store.set(SESSION_KEY, null); ME = null; location.href = homeUrl('chapters');
}
function flash(el, text, kind) { if (el) { el.textContent = text; el.className = 'status ' + (kind || ''); } }

// ── state ────────────────────────────────────────────────────────────────────
let ME = null;            // GET /api/me
let route = 'chapters';
let INVITE = null;
const isStaff = () => ME && (ME.role === 'admin' || ME.role === 'coadmin');
const isAdmin = () => ME && ME.role === 'admin';
const needsWelcome = () => ME && !ME.consent_current;   // no consent, withdrawn, or consent to an older text

function readHash() {
  const parts = Object.fromEntries(location.hash.slice(1).split('&').filter(Boolean).map(p => {
    const i = p.indexOf('='); return i < 0 ? [p, ''] : [p.slice(0, i), decodeURIComponent(p.slice(i + 1))];
  }));
  if (parts.session) {                       // just back from ORCID sign-in: keep the token, clean the URL
    store.set(SESSION_KEY, parts.session);
    delete parts.session;
    history.replaceState(null, '', location.pathname + location.search + (Object.keys(parts).length ? '#' + Object.keys(parts).join('&') : ''));
  }
  if ('invite' in parts) INVITE = parts.invite;
  const r = Object.keys(parts).find(k => ['chapters', 'ack', 'me', 'admin', 'welcome'].includes(k));
  route = r || (INVITE ? 'invite' : 'chapters');
}

// ── shell ────────────────────────────────────────────────────────────────────
function renderShell() {
  const links = [[homeUrl('chapters'), 'Chapters', !B && route === 'chapters']];
  if (ME) (ME.chapters || []).filter(c => c.status === 'active').forEach(c =>
    links.push([c.chapter + '.html', 'Review ' + chLabel(c.chapter).split(' — ')[0], B && B.tag === c.chapter]));
  if (ME) links.push([homeUrl('me'), 'My status', !B && route === 'me']);
  links.push([homeUrl('ack'), 'Acknowledgements', !B && route === 'ack']);
  if (isStaff()) links.push([homeUrl('admin'), 'Admin', !B && route === 'admin']);
  $('nav').innerHTML = links.map(([h, l, on]) => `<a href="${h}" class="${on ? 'on' : ''}">${esc(l)}</a>`).join('');
  $('hdrRight').innerHTML = `<span class="chip">Release ${esc(IDX.release)}</span>` + (ME
    ? `<span class="chip">${esc(ME.person.name || ME.orcid)} · <span class="idicon">iD</span>${ME.role !== 'reviewer' ? ' · ' + ME.role : ''}</span>
       <button class="btn small" id="signOut">Sign out</button>`
    : `<button class="orcid-btn" id="signIn"><span class="idicon">iD</span> Sign in with ORCID</button>`);
  if ($('signIn')) $('signIn').onclick = () => signIn(B ? '' : route);
  if ($('signOut')) $('signOut').onclick = signOut;
}

async function boot() {
  readHash();
  if (store.get(SESSION_KEY)) {
    try { ME = await api('/api/me'); } catch (e) { ME = null; }
  }
  // reviewers confirm details and consent first; admins are not reviewers unless they choose to be
  if (!B && ME && ME.role === 'reviewer' && needsWelcome() && route !== 'ack') route = 'welcome';
  renderShell();
  if (B) return Review.start();
  const view = { chapters: viewChapters, ack: viewAck, me: viewMe, admin: Admin.start, welcome: viewWelcome, invite: viewInvite }[route];
  await (view || viewChapters)();
}
window.addEventListener('hashchange', boot);

// ── chapters ─────────────────────────────────────────────────────────────────
function viewChapters() {
  const mine = Object.fromEntries((ME ? ME.chapters : []).map(c => [c.chapter, c]));
  $('view').innerHTML = `<h1>Chapters</h1>
  <p class="lead">Synonyms proposed from the Mondo Disease Ontology (${esc(IDX.inputs.mondo)}) for the ICD-11 Foundation
    ${esc(IDX.inputs.icd11_foundation)}, release ${esc(IDX.release)}. Review is by invitation to a dedicated group of clinicians;
    each reviewer is assigned a full chapter. Anyone can read the proposals.</p>
  <table class="grid"><tr><th>Chapter</th><th>Title</th><th>Entities</th><th>Proposed synonyms</th>${ME ? '<th>You</th>' : ''}</tr>
  ${IDX.chapters.map(c => `<tr><td><a href="${c.tag}.html">${esc(c.chapter)}</a></td><td><a href="${c.tag}.html">${esc(c.title)}</a></td>
     <td>${c.entities.toLocaleString()}</td><td>${c.synonyms.toLocaleString()}</td>
     ${ME ? `<td class="small">${mine[c.tag] ? (mine[c.tag].status === 'active' ? `reviewing · ${mine[c.tag].decided} / ${c.synonyms}` : mine[c.tag].status) : ''}</td>` : ''}</tr>`).join('')}
  </table>`;
}

// ── invitation landing ───────────────────────────────────────────────────────
function viewInvite() {
  $('view').innerHTML = `<h1>You're invited to review</h1>
    <p class="lead">Sign in with your ORCID iD to accept the invitation. You'll then confirm your details and consent before reviewing.</p>
    <button class="orcid-btn" id="acceptInvite" style="border:1px solid var(--line)"><span class="idicon">iD</span> Sign in with ORCID and accept</button>`;
  $('acceptInvite').onclick = () => signIn('welcome', INVITE);
}

// ── first sign-in: details and consent ───────────────────────────────────────
// Consent text version 2 (server CONSENT_VERSION). Changing it means raising the version, so that
// everyone who agreed to the old text is asked again.
const CONSENT = `<p>By taking part in this review you agree that:</p><ul>
  <li>We store your ORCID iD, name, affiliation, email, specialty and every review answer, decision and comment you make, with dates.</li>
  <li><b>Two-step review.</b> For each proposed synonym you first say how it compares with the ICD-11 entity, without any AI or
      CodeFusion hint. You then see an explanation and a suggested answer written by an AI model (Claude, made by Anthropic), and
      answer again. Your first answer is locked once you open the explanation. The explanations were checked by a second AI pass,
      not by clinicians, and may contain errors; your own judgement decides. About 1 in 10 synonyms, chosen at random, have no
      explanation, so that answers with and without it can be compared.</li>
  <li><b>Research use.</b> Your answers and decisions are used in a study of how well reviewers agree with each other and with the AI,
      intended for publication. The analysis file replaces your name and ORCID iD with a code and keeps only your specialty.
      Publications report combined results only and never identify you or your individual answers.</li>
  <li>If the project lead credits your contribution, your name, ORCID iD and affiliation are listed publicly on the Acknowledgements page.
      Your email, specialty, comments, answers and individual decisions are never shown publicly.</li>
  <li>Your name, ORCID iD and affiliation may be used in future publications and in the submission of accepted synonyms to WHO.</li>
  <li>Taking part is voluntary. You can withdraw at any time from "My status". You are then removed from the public page and author
      lists, and your answers are left out of any research analysis not yet completed. Your decisions stay in the review record
      that is sent to WHO.</li></ul>`;

function profileFields(p, pre) {
  const v = k => esc(p[k] || pre[k] || '');
  return `<label>Name</label><div><input type="text" id="f_name" value="${v('name')}"><div class="help">From ORCID; edit it to the form you use on publications.</div></div>
    <label>Institution</label><div><input type="text" id="f_institution" value="${v('institution')}"></div>
    <label>Country</label><div><input type="text" id="f_country" value="${v('country')}"></div>
    <label>ROR ID</label><div><input type="text" id="f_ror" value="${v('ror')}" placeholder="https://ror.org/…  (recommended)">
      <div class="help">Recommended: find your institution's ROR ID at <a href="https://ror.org" target="_blank" rel="noopener">ror.org</a>.
      Your name and affiliation may be used for future publications arising from this review.</div></div>
    <label>Email</label><div><input type="email" id="f_email" value="${v('email')}"><div class="help">Required, so we can contact you about the review and authorship. Never shown publicly.</div></div>`;
}
const requestable = () => IDX.chapters.filter(c => !ME.chapters.some(x => x.chapter === c.tag && ['active', 'requested'].includes(x.status)));
const readProfile = () => Object.fromEntries(['name', 'institution', 'country', 'ror', 'email', 'specialty', 'note']
  .filter(k => $('f_' + k)).map(k => [k, $('f_' + k).value]));

function viewWelcome() {
  if (!ME) return viewChapters();
  const p = ME.person, pre = ME.prefill || {};
  const active = ME.chapters.filter(c => c.status === 'active');
  $('view').innerHTML = `<h1>Welcome — confirm your details</h1>
    ${p.consent_at && !p.withdrawn_at ? `<div class="note warn">The consent text has changed. It now describes the two-step review with
      AI explanations and the research use of your answers. Please read it and agree again to continue reviewing.</div>` : ''}
    <p class="lead">${active.length ? `You are invited to review ${active.map(c => '<b>Chapter ' + esc(chLabel(c.chapter)) + '</b>').join(', ')}.`
      : 'You are signed in, but not assigned to a chapter yet. You can request one below; the project lead approves requests.'}</p>
    <div class="card"><div class="form">
      <label>ORCID iD</label><div style="padding-top:5px">${orcidLink(ME.orcid)} <span class="pill ok">verified by sign-in</span></div>
      ${profileFields(p, pre)}
      <label>Clinical specialty</label><input type="text" id="f_specialty" value="${esc(p.specialty || '')}" placeholder="e.g. infectious diseases">
      <label>Other chapters</label><div><select multiple size="5" id="f_requests">${requestable()
        .map(c => `<option value="${c.tag}">${esc(c.chapter)} — ${esc(c.title)}</option>`).join('')}</select>
        <div class="help">Optional: request more chapters (Ctrl/Cmd-click for several); the project lead approves.</div></div>
      <label>Note</label><textarea rows="2" id="f_note" placeholder="Optional: relevant experience">${esc(p.note || '')}</textarea>
      <label>Consent</label><div class="consent">${CONSENT}<label style="display:flex;gap:8px;font-weight:600;margin-top:8px"><input type="checkbox" id="f_consent"> I agree</label></div>
      <span></span><div><button class="btn primary" id="save">Save and continue</button><span class="status" id="st"></span></div>
    </div></div>`;
  $('save').onclick = async () => {
    if (!$('f_consent').checked) return flash($('st'), 'Please tick the consent box.', 'err');
    try {
      ME = await api('/api/me', { method: 'PUT', body: { ...readProfile(), consent: true,
        request_chapters: [...$('f_requests').selectedOptions].map(o => o.value) } });
      const first = ME.chapters.find(c => c.status === 'active');
      location.href = first ? first.chapter + '.html' : homeUrl('me');
    } catch (e) { flash($('st'), e.message, 'err'); }
  };
}

// ── my status ────────────────────────────────────────────────────────────────
function viewMe() {
  if (!ME) { $('view').innerHTML = '<p class="lead">Sign in with ORCID to see your status.</p>'; return; }
  const p = ME.person;
  $('view').innerHTML = `<h1>My status</h1><p class="lead">Only you and the project admins can see this page.</p>
  <div class="card"><h2 style="margin-top:0">Profile</h2><div class="form">
    <label>ORCID iD</label><div style="padding-top:5px">${orcidLink(ME.orcid)}</div>
    ${profileFields(p, {})}
    <label>Clinical specialty</label><input type="text" id="f_specialty" value="${esc(p.specialty || '')}">
    <span></span><div><button class="btn primary" id="save">Save</button><span class="status" id="st">Changes go live immediately and are logged.</span></div>
  </div></div>
  <div class="card"><h2 style="margin-top:0">Chapters</h2><table class="grid"><tr><th>Chapter</th><th>Status</th><th>Your decisions</th><th>Public credit</th></tr>
    ${ME.chapters.map(c => `<tr><td>${c.status === 'active' ? `<a href="${c.chapter}.html">${esc(chLabel(c.chapter))}</a>` : esc(chLabel(c.chapter))}</td>
      <td>${c.status === 'requested' ? 'waiting for approval' : c.status === 'declined'
        ? `declined <button class="btn small" data-again="${c.chapter}">Request again</button>` : esc(c.status)}</td><td>${c.decided} / ${(IDX.chapters.find(x => x.tag === c.chapter) || {}).synonyms || '?'}</td>
      <td>${c.credited ? '<span class="pill ok">credited</span>' : '<span class="pill grey">not yet credited</span>'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No chapters yet.</td></tr>'}
  </table>
  <p class="row" style="margin-top:10px"><select class="btn" id="reqSel">${requestable()
    .map(c => `<option value="${c.tag}">${esc(c.chapter)} — ${esc(c.title)}</option>`).join('')}</select>
    <button class="btn small" id="reqBtn">Request this chapter</button><span class="status" id="reqSt"></span></p></div>
  <div class="card"><h2 style="margin-top:0">Consent and data</h2>
    <p>${p.withdrawn_at ? `You withdrew on ${esc(p.withdrawn_at.slice(0, 10))}. <a href="${homeUrl('welcome')}">Give consent again</a>`
      : `Consent given ${esc((p.consent_at || '').slice(0, 10))}. <button class="btn small" id="withdraw">Withdraw consent</button>`}</p>
    <p><button class="btn small" id="dlCsv">Download my data (CSV)</button> <button class="btn small" id="dlJson">Download my data (JSON)</button></p></div>`;
  $('save').onclick = async () => {
    try { ME = await api('/api/me', { method: 'PUT', body: readProfile() }); flash($('st'), 'Saved.', 'ok'); renderShell(); }
    catch (e) { flash($('st'), e.message, 'err'); }
  };
  const request = async chapter => {
    try { await api('/api/me/requests', { method: 'POST', body: { chapter } }); ME = await api('/api/me'); viewMe(); }
    catch (e) { flash($('reqSt'), e.message, 'err'); }
  };
  $('reqBtn').onclick = () => request($('reqSel').value);
  document.querySelectorAll('[data-again]').forEach(b => b.onclick = () => request(b.dataset.again));
  if ($('withdraw')) $('withdraw').onclick = async () => {
    if (!window.confirm('Withdraw consent? You will be removed from the public page and author lists, and your answers will be left out of research analyses not yet completed. Your decisions stay in the review record.')) return;
    await api('/api/me/withdraw', { method: 'POST' }); ME = await api('/api/me'); viewMe();
  };
  $('dlCsv').onclick = () => download('/api/me/export?format=csv', 'my-review-decisions.csv');
  $('dlJson').onclick = () => download('/api/me/export?format=json', 'my-review-data.json');
}

// ── acknowledgements (public) ────────────────────────────────────────────────
async function viewAck() {
  $('view').innerHTML = `<h1>Acknowledgements: expert reviewers</h1>
    <div class="note">This page credits the expert reviewers only. The pipeline team, data sources and tools are credited in the
      <a href="https://github.com/tannerzhang/foundation-synonym-enrichment/wiki" target="_blank" rel="noopener">project wiki</a>.</div>
    <div id="ackBody" class="muted small">Loading…</div>`;
  let data, live = true;
  try {
    data = await api('/api/credits');
    store.set(CREDITS_KEY, JSON.stringify(data));
  } catch {
    live = false;
    data = JSON.parse(store.get(CREDITS_KEY) || 'null');
    if (!data) data = await fetch('data/credits.json').then(r => r.json()).catch(() => null);
  }
  if (!data) { $('ackBody').innerHTML = '<div class="note warn">The review server cannot be reached and no saved list is available.</div>'; return; }
  $('ackBody').className = '';
  $('ackBody').innerHTML = (live ? '<p class="small muted">Loaded live from the review server.</p>'
      : `<div class="note warn">The review server can't be reached. Showing the last saved list, as of ${esc(data.as_of.slice(0, 10))}.</div>`) +
    (data.chapters.length ? data.chapters.map(ch => `<div class="ackch"><h3>Chapter ${esc(chLabel(ch.chapter))}</h3>
      ${ch.people.map(p => `<div class="person"><div><b>${esc(p.name)}</b></div><div>${orcidLink(p.orcid)}</div>
        <div>${esc([p.institution, p.country].filter(Boolean).join(', '))}</div></div>`).join('')}</div>`).join('')
      : '<p class="muted">No reviewers are credited yet.</p>');
}

// ── chapter review page ──────────────────────────────────────────────────────
const CF_REL = {
  confirmed: ['✓ confirmed', 'CodeFusion coded this term to the pipeline’s entity.'],
  broader: ['↑ broader', 'CodeFusion’s target is broader — usually acceptable.'],
  narrower: ['↓ narrower', 'CodeFusion’s target is more specific — usually acceptable.'],
  sibling: ['↔ sibling', 'CodeFusion placed the term on a sibling entity — check which is right.'],
  unrelated: ['⚠ unrelated', 'CodeFusion placed the term on a different branch — review carefully.'],
  nomatch: ['∅ no match', 'CodeFusion could not place this term (below its match threshold) — weak term.'],
  rootfallback: ['∅ no specific match', 'CodeFusion fell back to a broad container (e.g. a chapter root) — no specific entity.'],
};
const contested = rel => ['unrelated', 'nomatch', 'rootfallback'].includes(rel);
const cfPill = cf => `<span class="cf ${cf.rel}" title="${esc(CF_REL[cf.rel][1])}${cf.level ? ' MatchLevel ' + esc(cf.level) + ', score ' + cf.score + '.' : ''}">${CF_REL[cf.rel][0]}</span>`;
const meter = n => `<span class="meter" title="Source confidence ${n}/5: number and authority of upstream sources">${'●'.repeat(n)}<i>${'●'.repeat(5 - n)}</i></span>`;
// A reviewer's decision follows their final answer (the server sets it); only wording and skip are separate.
const DERIVED = { same: 'accept', narrower: 'narrower', broader: 'reject', related: 'reject', different: 'reject', unclear: 'flag' };
const ACCEPTED = ['accept', 'variant', 'edit'];
const DECISION_LABEL = { accept: ['ok', '✓ Accept'], variant: ['ok', '✓ Accept, variant wording'], edit: ['ok', '✓ Accept, edited wording'],
  narrower: ['ok', '↓ Accept as narrower term'], reject: ['bad', '✗ Reject'], flag: ['warn', '⚠ Flag for the admin'], skip: ['grey', '⏭ Skipped'] };
const decisionPill = d => { const [c, l] = DECISION_LABEL[d] || ['grey', d || '—']; return `<span class="pill ${c}">${esc(l)}</span>`; };
// Answers in the two-step review (same categories as the AI's suggested answer)
const RELATIONS = [['same', 'Same condition', 'Names exactly the same patients as the ICD entity'],
  ['narrower', 'Narrower', 'Covers fewer patients than the ICD entity: a subtype or more specific form'],
  ['broader', 'Broader', 'Covers more patients than the ICD entity'],
  ['related', 'Related, not the same', 'Overlaps with or is associated with the entity, but is not the same condition'],
  ['different', 'Different condition', 'Names another condition'],
  ['unclear', "Can't tell", 'Not enough information to judge']];
const relLabel = r => (RELATIONS.find(x => x[0] === r) || [r, r])[1];
const CONF_HELP = ['', 'Guess', 'Unsure', 'Fairly sure', 'Sure', 'Certain'];
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';

const Review = {
  sel: 0, filter: 'all', sort: 'conf', cfOn: true, about: false, mine: {}, locked: new Set(), closed: false, canEdit: false,
  judg: {}, expl: {}, pend: {}, editSecond: new Set(),

  async start() {
    const asg = ME && ME.chapters.find(c => c.chapter === B.tag);
    this.canEdit = !!(asg && asg.status === 'active' && ME.consent_current);
    if (this.canEdit) {
      try {
        const d = await api('/api/decisions?chapter=' + B.tag);
        this.mine = d.decisions; this.locked = new Set(d.locked); this.closed = d.closed;
        this.judg = d.judgements || {}; this.expl = d.explanations || {};
        if (d.closed) this.canEdit = false;
      } catch (e) { this.banner = 'Could not load your decisions: ' + e.message; this.canEdit = false; }
    }
    const want = location.hash.match(/entity=(\d+)/);
    if (want) this.sel = Math.max(0, B.entities.findIndex(e => e.id === want[1]));
    this.render();
  },
  // view: not reviewing · first: no answer yet · reveal: answered, not locked yet ·
  // second: step 2 opened (explanation, or none for a holdout synonym), final answer due · done: decided
  stage(p) {
    const J = this.judg[p.id];
    if (!this.canEdit) return 'view';
    if (!J) return 'first';
    if (!J.revealed) return 'reveal';
    if (!J.revised_relation || this.editSecond.has(p.id)) return 'second';
    return 'done';
  },
  // CodeFusion's verdicts are hints too: hidden from a reviewer until their first answer is locked
  cfShown(p) { return ['view', 'second', 'done'].includes(this.stage(p)); },
  entityCfShown(e) { return e.proposals.every(p => this.cfShown(p)); },
  severity(e) {
    if (!this.entityCfShown(e)) return 0;
    const rels = [...Object.values(e.mondo).map(m => m.cf.rel), ...e.proposals.map(p => p.cf.rel)].filter(r => r !== 'confirmed');
    return !rels.length ? 0 : rels.some(contested) ? 2 : 1;
  },
  decided(p) { return !!(this.mine[p.id] && this.mine[p.id].decision); },
  visible() {
    return B.entities.map((e, i) => ({ e, i })).filter(({ e }) =>
      this.filter === 'open' ? e.proposals.some(p => !this.decided(p))
      : this.filter === 'cf' ? this.severity(e) > 0
      : this.filter === 'flag' ? e.proposals.some(p => (this.mine[p.id] || {}).decision === 'flag')
      : true);
  },
  render() {
    const e = B.entities[this.sel];
    const all = B.entities.flatMap(x => x.proposals);
    const nDone = all.filter(p => this.decided(p)).length, nFirst = all.filter(p => this.judg[p.id]).length;
    const role = !ME ? `<div class="note">Read-only. Reviewers invited to this chapter <a href="#" id="signLink">sign in with ORCID</a> to record decisions.</div>`
      : this.closed ? '<div class="note warn">This chapter is closed; decisions are locked.</div>'
      : !this.canEdit ? `<div class="note">Read-only: you are not an active reviewer of this chapter${needsWelcome() ? ' (consent is needed first — see <a href="' + homeUrl('welcome') + '">Welcome</a>)' : ''}.</div>` : '';
    const list = this.visible().map(({ e: x, i }) => {
      const sev = this.cfOn ? this.severity(x) : 0, done = x.proposals.filter(p => this.decided(p)).length;
      return `<div class="item ${i === this.sel ? 'sel' : ''}" data-i="${i}">
        <span class="dot ${done === 0 ? '' : done === x.proposals.length ? 'done' : 'part'}"></span>
        ${sev ? `<span class="cfdot ${sev === 2 ? 'sev2' : ''}" title="CodeFusion ${sev === 2 ? 'contests a mapping or synonym' : 'diverges (related entity)'}"></span>` : ''}
        <div class="lbl">${esc(x.title)}<div class="sub">${esc(Object.values(x.mondo).map(m => m.label).join('; '))} · ${done}/${x.proposals.length}</div></div></div>`;
    }).join('') || '<div class="item muted">No entities match this filter.</div>';
    const props = [...e.proposals].sort(this.sort === 'alpha' ? (a, b) => a.text.localeCompare(b.text)
      : (a, b) => b.confidence - a.confidence || a.text.localeCompare(b.text));
    $('view').innerHTML = `${this.banner ? `<div class="note warn">${esc(this.banner)}</div>` : ''}
    <div class="row" style="justify-content:space-between"><div><h1>Chapter ${esc(B.chapter)} — ${esc(B.chapter_title)}</h1>
      <p class="lead">${ME && this.canEdit ? `Your first answers: ${nFirst} of ${all.length} · decisions: ${nDone} of ${all.length}. Saved automatically. Your review is independent: other reviewers' decisions are never shown to you.`
        : `${B.entities.length} entities, ${all.length} proposed synonyms.`}</p></div>
      <div class="row">
        <label class="switch"><input type="checkbox" id="cfToggle" ${this.cfOn ? 'checked' : ''}> CodeFusion overlay</label>
        <button class="btn small" id="cfAboutBtn">ⓘ About CodeFusion</button>
        <select class="btn" id="filterSel">${[['all', 'All entities'], ['open', 'Not fully decided by me'], ['cf', 'CodeFusion disagrees'], ['flag', 'Flagged by me']]
          .map(([k, l]) => `<option value="${k}" ${this.filter === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select class="btn" id="sortSel"><option value="conf" ${this.sort === 'conf' ? 'selected' : ''}>Sort: source confidence</option><option value="alpha" ${this.sort === 'alpha' ? 'selected' : ''}>Sort: A–Z</option></select>
      </div></div>${role}
    ${this.canEdit ? `<div class="note">Each synonym has three short steps: <b>1</b> give your answer, <b>2</b> lock it and read the AI explanation
      (about 1 in 10 synonyms have none, for comparison), <b>3</b> give your final answer, keeping or changing the first. Your final answer is
      your decision: same condition → accept · narrower → accept as narrower term · broader, related or different → reject · can't tell → flag for the admin.</div>` : ''}
    <div class="review"><div class="elist">${list}</div><div>
      <div class="card ehead">
        <div class="uri">Foundation <span class="mono">http://id.who.int/icd/entity/${esc(e.id)}</span>${e.mms_code ? ' · MMS <b>' + esc(e.mms_code) + '</b>' : ''} ·
          <a href="${esc(e.browser || browserUrl(e.id))}" target="_blank" rel="noopener">ICD-11 browser ↗</a></div>
        <div class="title">${esc(e.title)}</div>
        ${e.fsn && e.fsn !== e.title ? `<div class="small muted">Fully specified name: ${esc(e.fsn)}</div>` : ''}
        <div class="def">${esc(e.definition) || '<span class="muted">No definition in the Foundation.</span>'}</div>
        <div>${Object.entries(e.mondo).map(([c, m]) => `<span class="mondo">${esc(c)}</span>${esc(m.label)}`).join(' &nbsp; ')}
          ${e.chapters_all.length > 1 ? ` <span class="pill info" title="Foundation polyhierarchy">also under chapters ${esc(e.chapters_all.filter(c => 'ch' + c !== B.tag).join(', '))}</span>` : ''}</div>
        <div class="ctx">
          <div class="box"><b>Parents</b>${e.parents.map(p => `<a href="${browserUrl(p.id)}" target="_blank" rel="noopener">${esc(p.title)}</a>`).join('<br>') || '<span class="muted">none</span>'}</div>
          <div class="box"><b>Existing ICD-11 synonyms (${e.existing.length})</b>${e.existing.map(esc).join('<br>') || '<span class="muted">none</span>'}</div>
          <div class="box"><b>Narrower / inclusions / exclusions</b>${[...e.narrower, ...e.inclusions].map(esc).join('<br>') || '<span class="muted">none</span>'}
            ${e.exclusions.length ? '<br><i>Excl.:</i> ' + e.exclusions.map(esc).join(', ') : ''}</div>
        </div>
        ${this.cfOn && !this.entityCfShown(e) ? `<div class="small muted" style="margin-top:6px">CodeFusion's verdicts appear once you have locked your first answer for every synonym of this entity.</div>` : ''}
        ${this.cfOn && this.entityCfShown(e) ? Object.entries(e.mondo).map(([c, m]) => m.cf.rel === 'confirmed'
          ? `<div class="cfbanner ok"><span class="cf confirmed">CodeFusion: aligned</span> Mapping mode routes ${esc(c)} (label + synonyms) to this entity.</div>`
          : `<div class="cfbanner bad">${cfPill(m.cf)}<span>CodeFusion (mapping mode) routes ${esc(c)} to <b>${esc(m.cf.target_title || m.cf.target || 'no entity')}</b>
              ${m.cf.target ? `(<a href="${browserUrl(m.cf.target)}" target="_blank" rel="noopener">${esc(m.cf.target)} ↗</a>)` : ''}, not to this entity —
              MappingMatchLevel <b>${esc(m.cf.level)}</b>, score ${m.cf.score}. ${esc(CF_REL[m.cf.rel][1])}</span></div>`).join('') : ''}
      </div>
      <div class="row" style="margin:4px 0 2px"><b>Proposed synonyms (${e.proposals.length})</b>
        ${this.canEdit ? `<span class="small muted">· </span><button class="btn small" data-bulk="skip" title="Mark every synonym of this entity you have not answered as skipped">Skip unanswered</button>` : ''}</div>
      ${this.cfOn && this.entityCfShown(e) ? `<div class="cflegend"><b>CodeFusion</b> — WHO’s ICD-11 coder, run independently as a second opinion (version ${esc(B.inputs.codefusion)}); each synonym is coded on its own.
          <a href="#" id="cfAboutLink">ⓘ how to read these verdicts</a><br>
          ${['confirmed', 'broader', 'narrower', 'sibling', 'unrelated', 'nomatch'].map(r => `<span class="cf ${r}">${CF_REL[r][0]}</span>`).join(' ')}
          <span class="muted"> — a term coding to a parent or sibling on its own is expected, not an error; ⚠ unrelated and ∅ no match deserve a closer look.</span></div>` : ''}
      ${props.map(p => this.card(p)).join('')}
      <details class="card" ${e.rejected.length ? '' : ''}><summary><b>Not proposed by the pipeline (${e.rejected.length})</b>
        <span class="small muted">— for context; reasons from the filters</span></summary><div class="rej" style="margin-top:8px">
        ${e.rejected.map(r => `<div>${esc(r.text)}</div><div class="r">${esc(r.reason)}${r.detail ? ': ' + esc(r.detail) : ''}</div>`).join('')}</div></details>
    </div></div>${this.about ? this.aboutBox() : ''}`;
    this.bind();
  },
  card(p) {
    const D = this.mine[p.id] || {}, J = this.judg[p.id], stage = this.stage(p);
    const locked = this.locked.has(p.id) || !this.canEdit;
    const steps = stage === 'first' || stage === 'reveal' || stage === 'second';
    const cls = steps ? 'pending' : !D.decision ? '' : D.decision === 'reject' ? 'rejected' : D.decision === 'flag' ? 'flagged' : 'decided';
    const shown = ['variant', 'edit'].includes(D.decision) && D.final_text ? D.final_text : p.text;
    const dis = locked ? 'disabled' : '';
    const cf = this.cfOn && this.cfShown(p);
    return `<div class="syn ${cls} ${cf && contested(p.cf.rel) ? 'contested' : ''} ${this.locked.has(p.id) ? 'locked' : ''}" data-id="${p.id}">
      <div class="text">${esc(shown)}${shown !== p.text ? `<span class="small muted"> (proposed: ${esc(p.text)})</span>` : ''}
        ${this.locked.has(p.id) ? ' <span class="pill grey">final — locked</span>' : ''}<span class="status" data-st></span></div>
      <div class="meta">${meter(p.confidence)}<span>${esc(p.source.replace('Mondo (no upstream xref)', 'Mondo only'))}</span>
        <span class="mono">${esc(p.source_id)}</span><span class="mono">${esc(p.mondo)}</span>
        ${cf ? `<span>CodeFusion ${cfPill(p.cf)}</span>${p.cf.target ? `<span>→ <a href="${browserUrl(p.cf.target)}" target="_blank" rel="noopener">${esc(p.cf.target_title || p.cf.target)} ↗</a> (score ${p.cf.score})</span>` : ''}` : ''}
        <span class="mono" title="Stable ID: same entity + text keeps this ID across releases">${p.id}</span></div>
      ${stage === 'first' || stage === 'reveal' ? this.stepFirst(p, J, D, stage) : ''}
      ${stage === 'second' ? (this.expl[p.id] ? this.explPanel(this.expl[p.id], true) : this.noExplanation(J)) + this.stepSecond(p, J) : ''}
      ${stage === 'done' ? this.answersLine(J, D, locked) + this.explPanel(this.expl[p.id], false) : ''}
      ${stage === 'done' && ACCEPTED.includes(D.decision) ? this.wording(p, D, dis, locked) : ''}
      ${stage === 'done' && D.decision ? `<div class="extra" style="grid-template-columns:1fr">
        <input data-f="comment" ${dis} placeholder="Comment — visible to admins only" value="${esc(D.comment || '')}"></div>` : ''}
      ${stage === 'view' && D.decision ? `<div class="answers">Decision: ${decisionPill(D.decision)}</div>` : ''}</div>`;
  },
  // wording tools for an accepted synonym: a variant the pipeline did not pick, or edited wording
  wording(p, D, dis, locked) {
    return `${p.variants.length ? `<div class="variants">Equivalent variants the pipeline did not pick${locked ? '' : ' (click to use one instead; click again to undo)'}: ${p.variants.map(v =>
        `<button data-variant="${esc(v)}" ${dis} class="${D.decision === 'variant' && D.final_text === v ? 'chosen' : ''}">⇄ ${esc(v)}</button>`).join('')}</div>` : ''}
      <div class="decide"><button class="edit ${D.decision === 'edit' ? 'on' : ''}" data-editwording ${dis}>✎ Edit wording…</button></div>
      ${D.decision === 'edit' ? `<div class="extra" style="grid-template-columns:1fr"><input data-f="final_text" ${dis} placeholder="Your wording (goes to the admin for review)" value="${esc(D.final_text || '')}"></div>` : ''}`;
  },
  noExplanation(J) {
    return `<div class="expl"><b>Step 2 · No AI explanation</b> <span class="small muted">${J.holdout
      ? 'This synonym is in the comparison group (about 1 in 10, chosen at random) and has no AI explanation. Look at your answer again and keep or change it.'
      : 'No AI explanation is available for this synonym. Look at your answer again and keep or change it.'}</span></div>`;
  },
  answerButtons(step, P, firstAnswer) {
    return `<div class="relbtns" data-step="${step}">${RELATIONS.map(([k, l, h]) => `<button data-rel="${k}" title="${esc(h)}" class="${P.relation === k ? 'on' : ''}">${esc(l)}${firstAnswer === k ? '<span class="firstmark">your first answer</span>' : ''}</button>`).join('')}</div>
      <div class="confbtns" data-step="${step}"><span class="small muted">Confidence</span>${[1, 2, 3, 4, 5].map(n =>
        `<button data-conf="${n}" title="${CONF_HELP[n]}" class="${P.confidence === n ? 'on' : ''}">${n}</button>`).join('')}<span class="small muted">1 = guess · 5 = certain</span></div>`;
  },
  stepFirst(p, J, D, stage) {
    const P = this.pend[p.id] || (J ? { relation: J.blind_relation, confidence: J.blind_confidence } : {});
    return `<div class="step"><div class="stephead"><b>Step 1 · Your answer</b>
        <span class="small muted">How does this phrase compare with the ICD entity? Answer from your own knowledge, before any AI or CodeFusion hint.</span></div>
      ${this.answerButtons('first', P)}
      ${stage === 'reveal' ? `<div class="row stepnext"><button class="btn primary small" data-reveal>Lock my answer and go to step 2</button>
        <span class="small muted">Saved. You can change it until you lock it.</span></div>` : ''}
      ${D.decision === 'skip' ? `<div class="small muted">Skipped. Answer it to review it after all.</div>`
        : D.decision ? `<div class="small muted">Decision recorded before the two-step review: ${esc(D.decision)}. Your final answer will replace it.</div>`
        : `<div class="small"><button class="linkbtn" data-skip>Skip this synonym</button></div>`}</div>`;
  },
  stepSecond(p, J) {
    const P = this.pend[p.id] || (J.revised_relation ? { relation: J.revised_relation, confidence: J.revised_confidence } : {});
    return `<div class="step"><div class="stephead"><b>Step 3 · Your final answer</b>
        <span class="small muted">Your first answer: ${esc(relLabel(J.blind_relation))}, confidence ${J.blind_confidence}. Keep it or change it. Your final answer is your decision.</span></div>
      ${this.answerButtons('second', P, J.blind_relation)}
      <div class="row stepnext"><button class="btn primary small" data-savesecond ${P.relation && P.confidence ? '' : 'disabled'}>Save my final answer</button>
        ${P.relation ? `<span class="small muted">Decision: ${decisionPill(DERIVED[P.relation])}</span>` : ''}</div></div>`;
  },
  answersLine(J, D, locked) {
    return `<div class="answers">Your first answer <b>${esc(relLabel(J.blind_relation))}</b> (confidence ${J.blind_confidence})
      → final answer <b>${esc(relLabel(J.revised_relation))}</b> (confidence ${J.revised_confidence})
      · Decision: ${decisionPill(D.decision || DERIVED[J.revised_relation])}
      ${locked ? '' : '<button class="linkbtn" data-editsecond>change final answer</button>'}
      ${J.holdout ? '<span class="small muted">· No AI explanation (comparison group).</span>' : ''}</div>`;
  },
  explPanel(x, open) {
    if (!x) return '';
    return `<details class="expl" ${open ? 'open' : ''}><summary><b>Step 2 · AI explanation</b> <span class="pill info">AI's answer: ${esc(relLabel(x.llm_relation))}</span></summary>
      <p class="small muted">Written by an AI model (Claude) and checked by a second AI pass, not by clinicians. It may contain errors; your judgement decides.</p>
      <p><b>The ICD entity:</b> ${esc(x.about)}</p>
      <p><b>In plain words:</b> ${esc(x.plain_words)}</p>
      ${(x.word_by_word || []).length ? `<p><b>Word by word:</b></p><ul>${x.word_by_word.map(w => `<li><b>${esc(w.term)}</b>: ${esc(w.meaning)}</li>`).join('')}</ul>` : ''}
      <p><b>What happens in the body:</b> ${esc(x.what_happens)}</p>
      <p><b>Compared with the ICD entity:</b> ${esc(x.relation_reason)}</p>
      ${x.watch_out ? `<p class="watch"><b>Watch out:</b> ${esc(x.watch_out)}</p>` : ''}
      <p class="small">Sources: ${(x.sources || []).map(s => `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>`).join(' · ')}</p></details>`;
  },
  // record a click on a step's answer or confidence; the first answer saves as soon as both are chosen
  async answer(id, step, patch, card) {
    const J = this.judg[id];
    const base = this.pend[id] || (step === 'first'
      ? (J ? { relation: J.blind_relation, confidence: J.blind_confidence } : {})
      : (J && J.revised_relation ? { relation: J.revised_relation, confidence: J.revised_confidence } : {}));
    this.pend[id] = { ...base, ...patch };
    if (step === 'first' && this.pend[id].relation && this.pend[id].confidence) return this.saveAnswer(id, 'first', card);
    this.render();
  },
  async saveAnswer(id, step, card) {
    const P = this.pend[id] || {};
    flash(card && card.querySelector('[data-st]'), 'saving…');
    try {
      const r = await api('/api/judgements/' + id, { method: 'PUT', body: { stage: step, relation: P.relation, confidence: P.confidence } });
      this.judg[id] = r.judgement; delete this.pend[id];
      if (step === "second") this.editSecond.delete(id);
      this.render();
    } catch (e) { flash(card && card.querySelector('[data-st]'), e.message, 'err'); }
  },
  async reveal(id, card) {
    flash(card.querySelector('[data-st]'), 'opening…');
    try {
      const r = await api(`/api/judgements/${id}/reveal`, { method: 'POST' });
      this.expl[id] = r.explanation; this.judg[id] = r.judgement; delete this.pend[id];
      this.render();
    } catch (e) { flash(card.querySelector('[data-st]'), e.message, 'err'); }
  },
  async save(id, D, card) {
    const st = card && card.querySelector('[data-st]');
    flash(st, 'saving…');
    try {
      await api('/api/decisions/' + id, { method: 'PUT', body: D.decision ? D : { decision: '' } });
      if (D.decision) this.mine[id] = D; else delete this.mine[id];
      flash(st, 'saved', 'ok');
      return true;
    } catch (e) { flash(st, e.message, 'err'); return false; }
  },
  bind() {
    const view = $('view');
    if ($('signLink')) $('signLink').onclick = ev => { ev.preventDefault(); signIn(''); };
    view.querySelectorAll('.elist .item[data-i]').forEach(el => el.onclick = () => { this.sel = +el.dataset.i; this.render(); window.scrollTo(0, 0); });
    $('cfToggle').onchange = ev => { this.cfOn = ev.target.checked; this.render(); };
    $('filterSel').onchange = ev => { this.filter = ev.target.value; this.render(); };
    $('sortSel').onchange = ev => { this.sort = ev.target.value; this.render(); };
    const openAbout = ev => { ev.preventDefault(); this.about = true; this.render(); };
    $('cfAboutBtn').onclick = openAbout;
    if ($('cfAboutLink')) $('cfAboutLink').onclick = openAbout;
    if ($('cfModal')) {
      $('cfClose').onclick = () => { this.about = false; this.render(); };
      $('cfModal').onclick = ev => { if (ev.target.id === 'cfModal') { this.about = false; this.render(); } };
    }
    view.querySelectorAll('.syn').forEach(card => {
      const id = card.dataset.id, cur = () => ({ ...(this.mine[id] || {}) });
      const commit = async D => { if (await this.save(id, D, card)) this.render(); };
      card.querySelectorAll('.relbtns button, .confbtns button').forEach(b => b.onclick = () =>
        this.answer(id, b.parentElement.dataset.step, b.dataset.rel ? { relation: b.dataset.rel } : { confidence: +b.dataset.conf }, card));
      const rv = card.querySelector('[data-reveal]');
      if (rv) rv.onclick = () => this.reveal(id, card);
      const sv = card.querySelector('[data-savesecond]');
      if (sv) sv.onclick = () => this.saveAnswer(id, 'second', card);
      const es = card.querySelector('[data-editsecond]');
      if (es) es.onclick = () => { this.editSecond.add(id); this.render(); };
      const sk = card.querySelector('[data-skip]');
      if (sk) sk.onclick = () => commit({ decision: 'skip' });
      const ew = card.querySelector('[data-editwording]');
      if (ew) ew.onclick = () => {                     // edited wording is saved once typed; clicking again goes back to plain accept
        const D = cur();
        if (D.decision === 'edit') return commit({ decision: 'accept', comment: D.comment });
        this.mine[id] = { ...D, decision: 'edit', final_text: '' }; this.render();
      };
      card.querySelectorAll('[data-variant]').forEach(b => b.onclick = () => {
        const D = cur(), v = b.dataset.variant;
        commit(D.decision === 'variant' && D.final_text === v ? { decision: 'accept', comment: D.comment } : { decision: 'variant', final_text: v, comment: D.comment });
      });
      card.querySelectorAll('[data-f]').forEach(inp => inp.onchange = async () => {
        const D = { ...cur(), [inp.dataset.f]: inp.value };
        if (!D.decision) return;
        if (D.decision === 'edit' && !D.final_text) return;
        await this.save(id, D, card);
      });
    });
    view.querySelectorAll('[data-bulk]').forEach(b => b.onclick = async () => {
      for (const p of B.entities[this.sel].proposals) {   // only synonyms not answered and not decided yet
        if (!this.locked.has(p.id) && !this.judg[p.id] && !this.decided(p)) await this.save(p.id, { decision: 'skip' }, null);
      }
      this.render();
    });
  },
  aboutBox() {
    return `<div class="modal" id="cfModal"><div class="box">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">ⓘ About the CodeFusion overlay</h2><button class="btn small" id="cfClose">Close</button></div>
      <p><b>CodeFusion</b> is WHO’s ICD-11 coding and mapping engine. Here it is run independently (version ${esc(B.inputs.codefusion)},
        local Docker) as a second opinion on the pipeline’s Mondo → ICD-11 proposals. <a href="https://icd.who.int/docs/codefusion/en/" target="_blank" rel="noopener">Documentation ↗</a></p>
      <h3>Two modes, two levels</h3>
      <p><b>Mapping mode</b> takes the Mondo concept’s label and synonyms together: does CodeFusion route the whole concept to the entity the pipeline used? → the banner under the entity.<br>
      <b>Coding mode</b> codes each synonym on its own: where does that term land by itself? → the label on each synonym.</p>
      <h3>Concept verdict</h3>
      <p><b>Aligned / misaligned</b> depends only on whether CodeFusion picked the same entity. <b>MappingMatchLevel</b> (GoodMatch › OtherMatch ›
        ConflictingGoodMatch › NoMatch) is CodeFusion’s confidence, shown alongside. A confident GoodMatch that still disagrees is the strongest signal.</p>
      <h3>Synonym verdicts</h3>
      <p>${Object.keys(CF_REL).map(r => `<span class="cf ${r}">${CF_REL[r][0]}</span> ${esc(CF_REL[r][1])}`).join('<br>')}</p>
      <div class="keypt">A synonym coding to a parent or sibling on its own is expected, not an error. Only ⚠ unrelated and ∅ no match need real scrutiny.
        Rows with those are tinted; the entity list shows an amber dot for related divergence and a red dot for a contested mapping or synonym.</div>
    </div></div>`;
  },
};

    const letters = {};
    const who = d => this.reveal ? esc(d.name || d.orcid) : 'Reviewer ' + (letters[d.orcid] = letters[d.orcid] || String.fromCharCode(65 + Object.keys(letters).length));
    const el = this.body(`<div class="row" style="margin-bottom:10px"><select class="btn" id="adjCh">${this.chapterOptions(ch)}</select>

        <div class="row" style="margin-top:8px"><select class="btn" data-dec><option value="accept">Accept</option><option value="reject">Reject</option>

    if ($('expInt')) $('expInt').onclick = () => chosen() ? download(`/api/admin/export/internal?chapters=${chosen()}`, 'internal.csv')
      .catch(e => flash($('expSt'), e.message, 'err')) : flash($('expSt'), 'Choose chapters.', 'err');
    if ($('expStudy')) $('expStudy').onclick = () => chosen() ? download(`/api/admin/export/study?chapters=${chosen()}`, 'study-judgements.csv')
      .catch(e => flash($('expSt'), e.message, 'err')) : flash($('expSt'), 'Choose chapters.', 'err');
    el.querySelectorAll('[data-auth]').forEach(b => b.onclick = () => download('/api/admin/authors?format=' + b.dataset.auth, 'authors'));
  },

  async log() {
    const r = await api('/api/admin/log');
    this.body(`<table class="grid"><tr><th>When (UTC)</th><th>Who</th><th>What</th><th>Target</th><th>Detail</th></tr>
      ${r.events.map(e => `<tr><td class="small">${esc(e.at.replace('T', ' ').slice(0, 19))}</td><td class="small mono">${esc(e.orcid || '')}</td>
        <td>${esc(e.action)}</td><td class="small">${esc(e.target || '')}</td><td class="small mono">${esc(e.detail || '')}</td></tr>`).join('')}</table>
      <p class="small muted">Latest 200 events. Every decision, edit, credit change and export is logged.</p>`);
  },

  async settings() {
    const s = await api('/api/admin/settings');
    const dis = isAdmin() ? '' : 'disabled';
    this.body(`<div class="card"><div class="form">
      <label>Admin</label><div style="padding-top:5px">Set in the server configuration (ADMIN_ORCID).</div>
      <label>Co-admins</label><div><textarea id="coadmins" rows="3" ${dis} placeholder="one ORCID iD per line">${esc(s.coadmins.join('\n'))}</textarea>
        <div class="help">Co-admins can view the roster, counts and progress, and export author lists.</div>
        <button class="btn small" id="saveCo" ${dis}>Save</button><span class="status" id="coSt"></span></div>
      <label>Sign-in</label><div style="padding-top:5px">ORCID (authorisation code, openid); sessions last 7 days.</div>
      <label>Reviews</label><div style="padding-top:5px">Each reviewer reviews their full chapter. Final when every active reviewer decided and all agree (at least two), otherwise adjudicated.</div>
    </div></div>`);
    if ($('saveCo')) $('saveCo').onclick = async () => {
      try {
        const r = await api('/api/admin/settings', { method: 'PUT', body: { coadmins: $('coadmins').value.split(/\s+/).map(x => x.replace('https://orcid.org/', '')).filter(Boolean) } });
        $('coadmins').value = r.coadmins.join('\n'); flash($('coSt'), 'Saved.', 'ok');
      } catch (e) { flash($('coSt'), e.message, 'err'); }
    };
  },
};

boot();

</script>
</body>
</html>
